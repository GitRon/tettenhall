<c-common.card id="fyrd-card" class="mb-5">
    {# The heading stands outside this element: it is the page's, and drafting a man swaps the box. #}
    <table>
        <tbody>
        <tr>
            <td>Reserve</td>
            <td>{{ faction.fyrd_reserve }}</td>
        </tr>
        </tbody>
    </table>
    {% if faction.fyrd_reserve %}
        <button hx-post="{% url 'warband:faction-draft-warrior-from-fyrd-view' faction.id %}"
                hx-disabled-elt="this"
                hx-target="#fyrd-card"
                hx-swap="outerHTML"
                class="row-action">Draft warrior
        </button>
    {% endif %}
</c-common.card>

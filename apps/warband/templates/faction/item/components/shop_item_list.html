<div hx-get="{% url 'warband:shop-item-list-htmx' faction.id %}"
     hx-trigger="loadShopItemList from:body"
     hx-swap="outerHTML"
     hx-disinherit="hx-swap">
    {# Headed by the page, not here: this element is what the swap replaces, so a heading inside it #}
    {# is a heading that disappears the first time something is bought off the stalls. #}
    {% for item in item_list %}
        {% include 'item/components/item_buy_card.html' with item=item %}
    {% endfor %}
</div>

{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
    <h1>{{ object.title }}</h1>
    <p class="text-ink-muted">{{ object.body }}</p>

    <div class="md:w-1/2">
        <table>
            <tbody>
            <tr>
                <td>Men</td>
                <td>{{ entry.MIN_MEN }}–{{ entry.MAX_MEN }}</td>
            </tr>
            <tr>
                <td>Away</td>
                <td>Until the month turns</td>
            </tr>
            <tr>
                <td colspan="2">{% crispy form %}</td>
            </tr>
            </tbody>
        </table>
    </div>
{% endblock content %}

{% load i18n static %}

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>500 - Internal server error</title>
    {# The two faces these pages actually set. They degrade to the Georgia in each stack if the
       static root is part of what is broken, which on a 500 is a real possibility. #}
    <link rel="stylesheet" href="{% static '@fontsource/cinzel/500.css' %}">
    <link rel="stylesheet" href="{% static '@fontsource/spectral/300.css' %}">
    <style type="text/css">
        /*
         * These three pages do not extend "base.html" - they are what Django reaches for when the
         * shell itself may be what failed - so the identity is written out here by hand rather than
         * compiled. Six values, one rule, no radius, the same as everywhere else.
         */
        body {
            min-width: 600px;
            width: 50%;
            margin: 0 auto;
            padding: 3rem 1rem;
            color: #8b8373;
            background: #0c0b0a;
            font-family: Spectral, Georgia, serif;
            font-size: 1.0625rem;
            font-weight: 300;
            line-height: 1.5;
        }

        h2 {
            margin: 0 0 1rem;
            color: #e6dcc9;
            font-family: Cinzel, Georgia, serif;
            font-size: 1.75rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        div.error {
            border-top: 1px solid #23201c;
            padding-top: 1.5rem;
        }

        div.imprint, div.imprint a {
            color: #8b8373;
            margin-top: 0.2em;
            text-align: center;
        }

        a {
            color: #e6dcc9;
            text-decoration-color: #23201c;
            text-underline-offset: 0.2em;
        }

        a:hover {
            text-decoration-color: #c05d46;
        }
    </style>
</head>

<body>
	{% block body %}
        <div class="error">

        <h2>Error 500</h2>
        <p>Internal server error.</p>
        </div>
    {% endblock body %}
</body>

<div hx-get="{% url 'faction:faction-item-list-htmx' faction.id %}"
     hx-trigger="loadFactionItemList from:body">
    <h2>Unused Items</h2>
    {% for item in faction.get_all_unoccupied_items %}
        {% include 'item/components/item_sell_card.html' with item=item %}
    {% empty %}
        <p class="uk-text-meta">Every item you own is being worn.</p>
    {% endfor %}
</div>

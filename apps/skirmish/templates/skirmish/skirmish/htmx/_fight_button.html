{% if not skirmish.victorious_faction %}
    <div hx-get="{% url 'skirmish:skirmish-fight-button-update-htmx' skirmish.id %}"
         hx-trigger="updateFightButton from:body">
        <button hx-post="{% url 'skirmish:skirmish-finish-round-view' skirmish.id %}"
                hx-target="#hidden-box"
                hx-include="select, input"
                class="uk-button uk-button-danger uk-float-right">
            Fight!
        </button>
    </div>
{% elif occupiable_faction %}
    {# The fight is over and the loser has nobody healthy left to hold his town. This is the moment #}
    {# the window opens, so the offer is made here rather than only on the rival's own page #}
    <form method="post" action="{% url 'faction:faction-occupy-view' occupiable_faction.id %}"
          class="uk-float-right">
        {% csrf_token %}
        <button type="submit" class="uk-button uk-button-danger">
            Ride into {{ occupiable_faction.town_name }}
        </button>
    </form>
{% endif %}

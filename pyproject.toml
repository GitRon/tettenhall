[project]
name = "tettenhall"
version = "0.1.0"
description = "A Django browser game about Anglo-Saxon factions"
requires-python = ">=3.14"
dependencies = [
    "Django~=6.1",
    "ambient-toolbox~=12.13",
    "crispy-bootstrap5~=2026.9",
    "django-axes~=8.3",
    "django-crispy-forms~=2.7",
    "django-queuebie~=0.6",
    "faker~=40.38",
]

[dependency-groups]
dev = [
    "boa-restrictor~=1.18",
    "django-removals",
    "factory-boy~=3.3",
    "import-linter~=2.5",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "pytest-django~=4.11",
]

[tool.uv]
# The project is an application, not a distributable package: there is nothing to build and
# installing it into its own virtualenv would be pointless.
package = false

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
lint.select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "N",       # pep8-naming
    "I",       # isort
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "DTZ",     # flake8-datetimez
    "DJ",      # flake8-django
    "LOG",     # flake8-logging
    "TID",     # flake8-tidy-imports
    "TD",      # flake8-to-do
    "Q",       # flake8-quotes
    "RET",     # flake8-return
    "RSE",     # flake8-raise
    "RUF",     # Ruff-specific rules
    "YTT",     # Avoid non-future-prove usages of "sys"
    "C4",      # Checks for unnecessary conversions
    "PIE",     # Bunch of useful rules
    "SIM",     # Simplifies your code
    "PERF",    # Perflint
    "PGH",     # No all-purpose "# noqa" and eval validation
    "UP",      # PyUpgrade
    "PLR2004", # Magic numbers
    "BLE",     # Checks for except clauses that catch all exceptions
    "ANN401",  # Checks that function arguments are annotated with a more specific type than Any
    "TRY",     # Clean try/except
    "ERA",     # Commented out code
    "INP"      # Ban PEP-420 implicit namespace packages
]
lint.ignore = [
    'N999',     # Project name contains underscore, not fixable
    'A003',     # Django attributes shadow python builtins
    'DJ001',    # Django model text-based fields shouldn't be nullable
    'TRY003',   # Avoid specifying long messages outside the exception class
    'PLR2004',  # Magic value used in comparison, consider replacing "x" with a constant variable
    'ERA001',   # Found commented-out code
    'PERF401',  # Use a list comprehension to create a transformed list
    'SIM108',   # Use ternary operator
    'TD002',    # Missing author in To-do
    'TD003',    # Missing issue link on the line following this To-do
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "N",       # pep8-naming
    "I",       # isort
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "DTZ",     # flake8-datetimez
    "DJ",      # flake8-django
    "LOG",     # flake8-logging
    "TID",     # flake8-tidy-imports
    "TD",      # flake8-to-do
    "Q",       # flake8-quotes
    "RET",     # flake8-return
    "RSE",     # flake8-raise
    "RUF",     # Ruff-specific rules
    "YTT",     # Avoid non-future-prove usages of "sys"
    "C4",      # Checks for unnecessary conversions
    "PIE",     # Bunch of useful rules
    "SIM",     # Simplifies your code
    "PERF",    # Perflint
    "PGH",     # No all-purpose "# noqa" and eval validation
    "UP",      # PyUpgrade
    "PLR2004", # Magic numbers
    "BLE",     # Checks for except clauses that catch all exceptions
    "ANN401",  # Checks that function arguments are annotated with a more specific type than Any
    "TRY",     # Clean try/except
    "ERA",     # Commented out code
    "INP"      # Ban PEP-420 implicit namespace packages
]
lint.unfixable = []

# Allow noqa's from "boa-restrictor" linter
lint.external = ["PBR", "DBR", "TBR"]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*"
]

# Same as Black.
line-length = 120

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.14. Two consequences worth knowing, both applied automatically:
# PEP 649 makes annotations lazy, so quoted forward references under TYPE_CHECKING are no longer
# needed, and PEP 758 allows "except A, B:" without the parentheses.
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
  # Allow seemingly unused imports
  "F401",
]

"**/tests/**/test_*.py" = [
  # Allow boolean positional params in tests (for assertIs())
  "FBT003",
]

[tool.boa-restrictor]
custom_rules = [
    "scripts.linting.no_future_annotations.NoFutureAnnotationsImportRule",
]
exclude = [
    "PBR005",
    "DBR002",
    # The "_list"/"_qs" suffix is the house convention here, and some of the names are not ours to
    # rename anyway ("object_list" is Django's, "command_dict"/"event_dict" are queuebie's)
    "PBR007",
    # The loops that trip this are all in the registry and view-scoping meta-tests, which iterate
    # over every handler and every view by construction - that is the point of those tests
    "PBR008",
]

[tool.boa-restrictor.per-file-excludes]
"*/admin.py" = [
    "PBR001",
    "PBR002",
]
"*/views.py" = [
    "PBR001",
    "PBR002",
]
"*/views/*.py" = [
    "PBR001",
    "PBR002",
]
# Mixins for those views override Django's own hooks, so the signatures are not ours to change
"*/mixins.py" = [
    "PBR001",
]
"*/context_processors/*.py" = [
    "PBR001",
]
"*/managers/*.py" = [
    "PBR002",  # todo: enable this
]
# Django calls RunPython/RunSQL callables positionally with (apps, schema_editor)
"*/migrations/*.py" = [
    "PBR001",
]
# pytest injects fixtures as positional arguments, so keyword-only signatures are impossible here
"conftest.py" = [
    "PBR001",
]
"*/tests/*" = [
    "PBR001",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apps.config.settings_test"
python_files = ["test_*.py"]
testpaths = ["apps", "scripts"]

[tool.coverage.run]
# Branch coverage, not just statement coverage: an "if" counts as covered as soon as its body ran,
# so a missing "else" and an unexercised loop exit would both pass unnoticed.
branch = true
source = ["apps", "scripts"]
omit = [
    "*/migrations/*",  # Generated
    "*/messages/*",    # Dataclasses, no logic
    "*/tests/*",       # The tests themselves
    "apps/config/*",   # Settings, wsgi/asgi
    "*/admin.py",      # Framework declarations
    "*/apps.py",       # Framework declarations
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.importlinter]
root_packages = ["apps"]

# A satellite is domain-independent by definition, so the direction of dependency is the whole point
# of splitting one out. Nothing enforced it before this contract existed, which is what let a
# game-balance decision ("High"/"Low"/"Mediocre") and the navbar's resource bar sit in "common".
#
# There are deliberately no contracts between the topic packages inside "apps.warband". They are
# meant to be free to move on a Wednesday afternoon, and the boundary that does need enforcing -
# a command handler living outside the scope of its command - is queuebie's strict mode.
[[tool.importlinter.contracts]]
name = "Satellites do not import the domain"
type = "forbidden"
source_modules = ["apps.common", "apps.faker_frisian", "apps.faker_gaelic", "apps.faker_old_english"]
forbidden_modules = ["apps.warband"]

# A name provider is a name provider and nothing else. It reaches for no other package of ours,
# "common" included, which is what keeps each of them lifting out into a library on the day the API
# settles.
[[tool.importlinter.contracts]]
name = "The name providers stand on their own"
type = "forbidden"
source_modules = ["apps.faker_frisian", "apps.faker_gaelic", "apps.faker_old_english"]
forbidden_modules = ["apps.common"]

# And that includes each other. The three languages share a shape - a name stock, an orthography, a
# handful of joining rules - and nothing else: a rule that fits Old English spelling has no business
# being reached for from the Gaelic or the Frisian one, and a shared helper between them would tie all
# three to whichever lifts out first. Frisian is where this bites hardest, its joining rules being the
# Old English ones with the endings changed - and restating them is the point.
[[tool.importlinter.contracts]]
name = "The name providers do not import each other"
type = "independence"
modules = ["apps.faker_frisian", "apps.faker_gaelic", "apps.faker_old_english"]

# "apps.config" is the settings package, not an app. Settings are read through "django.conf.settings",
# which is lazy and overridable in tests; importing the module directly bypasses both.
[[tool.importlinter.contracts]]
name = "No app imports the settings package"
type = "forbidden"
source_modules = ["apps.warband", "apps.common", "apps.faker_frisian", "apps.faker_gaelic", "apps.faker_old_english"]
forbidden_modules = ["apps.config"]

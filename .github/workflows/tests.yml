name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # uv reads the interpreter from .python-version and installs it if the runner lacks it.
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      # "--locked" fails on a stale lock file instead of quietly re-resolving, which is what
      # "pipenv verify" used to do here - without pipenv's hash algorithm changing under us.
      - name: Install dependencies
        run: uv sync --locked

      # Coverage config lives in pyproject.toml and fails the run below 100% branch coverage.
      - name: Run tests
        run: uv run pytest --cov

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # The hooks build their own isolated environments, which is the slow part of a cold run.
      - name: Cache the hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # Same hooks as the local commit hook: ruff, django-upgrade, djade and boa-restrictor.
      - name: Run the hooks
        run: pre-commit run --all-files --show-diff-on-failure

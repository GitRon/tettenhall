name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # uv reads the interpreter from .python-version and installs it if the runner lacks it.
      # Pinned to the exact release: unlike actions/checkout and friends, setup-uv publishes no
      # moving major tag, so "@v9" does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # "--locked" fails on a stale lock file instead of quietly re-resolving, which is what
      # "pipenv verify" used to do here - without pipenv's hash algorithm changing under us.
      - name: Install dependencies
        run: uv sync --locked

      # Coverage config lives in pyproject.toml and fails the run below 100% branch coverage.
      - name: Run tests
        run: uv run pytest --cov

      # The contracts live in pyproject.toml. This is the only thing standing between "apps/common is
      # a satellite" and a comment saying so, which is why it is a gate rather than a review habit.
      - name: Check the import boundaries
        run: uv run lint-imports

  # Its own job rather than a step in front of "pytest": the suite needs no stylesheet, so node there
  # would cost every run for nothing, and a failed build would be indistinguishable from a failed test.
  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # "--frozen-lockfile" fails on a lock file that has drifted from package.json instead of
      # resolving something else, the same guarantee "uv sync --locked" gives above.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The compiled stylesheet is not in version control, so this is the only thing that catches a
      # build that has stopped working. It writes to static/dist/ and the output is thrown away.
      - name: Build the stylesheet
        run: yarn build:css

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # The hooks build their own isolated environments, which is the slow part of a cold run.
      - name: Cache the hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # Same hooks as the local commit hook: ruff, django-upgrade, djade and boa-restrictor.
      - name: Run the hooks
        run: pre-commit run --all-files --show-diff-on-failure
